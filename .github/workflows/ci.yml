name: Core portability checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PQC_FONT_FILE: ${{ github.workspace }}/.ci-font/NotoSansCJKtc-Regular.otf
      PQC_FONT_FAMILY: Noto Sans CJK TC
      PQC_ALLOW_CLOUD: "0"
      PQC_ALLOW_PAID_MUSIC: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Prepare test font
        shell: python
        run: |
          import os
          from pathlib import Path
          import urllib.request
          target = Path(os.environ["PQC_FONT_FILE"])
          target.parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve(
              "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf",
              target,
          )
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q scripts tests
      - name: Check actual local runtime
        run: python -X utf8 scripts/setup_env.py
      - name: Check embedded notebook version
        run: python -X utf8 scripts/make_colab_nb.py --check
      - name: Run unit tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Run offline generated-media pipeline
        run: python -X utf8 scripts/smoke_test.py
